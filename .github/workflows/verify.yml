name: Verify project

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Audit client runtime dependencies
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Build client
        working-directory: client
        env:
          AUTH0_DOMAIN: example.us.auth0.com
          AUTH0_CLIENT_ID: test-client-id
          AUTH0_CLIENT_SECRET: test-client-secret
          AUTH0_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AUTH0_AUDIENCE: https://api.closet-circle.test
          AUTH0_SCOPE: openid profile email offline_access
          APP_BASE_URL: http://localhost:3000
          API_BASE_URL: http://127.0.0.1:8800
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Audit server runtime dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Run server tests
        working-directory: server
        run: npm test
